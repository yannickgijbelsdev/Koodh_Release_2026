<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>News · Koodh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#070B24;--navy-2:#111C52;--k3:#7C95DB;--k4:#B9C9F6;--ink:#EEF2FF;--muted:rgba(220,229,252,.66);--dim:rgba(220,229,252,.42);--card:rgba(255,255,255,.045);--hair:rgba(255,255,255,.08);--f-display:"Outfit","Plus Jakarta Sans",system-ui,sans-serif;--f-ui:"Plus Jakarta Sans","Outfit",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(90% 60% at 50% 0%,#141F52 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-inline:clamp(20px,4vw,48px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:26px}
.brand{display:inline-flex;align-items:center;gap:3px;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:27px;letter-spacing:-.03em;color:#fff}
.brand svg{width:15px;height:auto}
.brand svg polygon{fill:#7C95DB}
.back{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;text-decoration:none;font-size:14px;font-weight:600;transition:background .2s,transform .25s}
.back:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.back svg{width:12px}
.art{width:100%;max-width:820px;margin:0 auto;flex:1}
.meta{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#8FA6E8;margin:clamp(26px,5vw,56px) 0 14px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,4.6vw,58px);line-height:1.04;letter-spacing:-.04em;margin:0;text-wrap:balance}
figure{margin:clamp(26px,4vw,44px) 0}
figure img{width:100%;border-radius:20px;box-shadow:0 0 0 1px var(--hair)}
figcaption{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--dim);margin-top:10px}
figcaption p{margin:0}
.body{color:var(--muted);font-size:17px}
.body p{margin:0 0 1.2em}
.body a{color:var(--k4);text-decoration:underline;text-underline-offset:3px}
.body img{border-radius:16px;margin:1.4em auto;box-shadow:0 0 0 1px var(--hair)}
.body h2,.body h3,.body h4{font-family:var(--f-display);color:var(--ink);font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:1.6em 0 .6em;text-wrap:balance}
.body h2{font-size:30px}
.body h3{font-size:23px}
.body h4{font-size:19px}
.body ul,.body ol{margin:0 0 1.2em;padding-left:1.3em}
.body li{margin:.35em 0}
.body blockquote{margin:1.4em 0;padding:4px 0 4px 20px;border-left:3px solid var(--k3);color:var(--ink);font-size:19px}
.body pre{background:var(--navy-2);border-radius:14px;padding:16px 18px;overflow:auto;font-family:var(--f-mono);font-size:13.5px}
.body iframe,.body video{max-width:100%;border-radius:16px}
.body .clara-image-credit{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--dim);margin:-.7em 0 1.4em}
.state{color:var(--dim);font-size:15px;padding:60px 0;text-align:center}
.state a{color:var(--k3)}
.foot{padding:70px 0 40px;color:var(--dim);font-size:13px;text-align:center}
</style>
</head>
<body>
<header class="wrap top">
  <a class="brand" href="/" aria-label="Koodh, back to homepage" data-testid="brand-home-link"><svg viewBox="66 26 42 51" aria-hidden="true"><polygon points="91.95,30.476 98.589,30.476 77.733,47.939 102.696,72.502 96.441,72.502 71.467,47.939"/></svg>koodh</a>
  <a class="back" href="/nieuws/" data-testid="all-news-link"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7H2M6 3L2 7l4 4"/></svg> All news</a>
</header>
<main class="wrap">
  <article class="art" data-testid="article">
    <p class="state" id="a-state" data-testid="article-state">Loading article&hellip;</p>
    <div id="a-content" hidden>
      <p class="meta" id="a-meta" data-testid="article-meta"></p>
      <h1 id="a-title" data-testid="article-title"></h1>
      <figure id="a-fig" hidden>
        <img id="a-img" alt="" data-testid="article-image">
      </figure>
      <div class="body" id="a-body" data-testid="article-body"></div>
    </div>
  </article>
</main>
<footer class="foot">&copy; Koodh &middot; The right team for your IT solutions</footer>
<script>
(function(){
  var state=document.getElementById('a-state'),content=document.getElementById('a-content');
  var id=new URLSearchParams(location.search).get('id');
  function fail(msg){state.textContent=msg;state.innerHTML+=' <a href="/nieuws/">Back to all news</a>.';}
  if(!id){location.replace('/nieuws/');return}
  fetch('/api/news/articles/'+encodeURIComponent(id)).then(function(r){
    if(!r.ok)throw new Error(r.status===404?'nf':'err');
    return r.json()
  }).then(function(d){
    document.title=d.title+' · Koodh';
    var dt='';
    try{dt=new Date(d.published_at).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){}
    document.getElementById('a-meta').textContent=(dt?dt:'')+(d.category&&d.category.name?(dt?' · ':'')+d.category.name:'');
    document.getElementById('a-title').textContent=d.title||'';
    if(d.image_url){
      var fig=document.getElementById('a-fig');fig.hidden=false;
      var img=document.getElementById('a-img');img.src=d.image_url;
      img.onerror=function(){fig.hidden=true};
    }
    document.getElementById('a-body').innerHTML=d.body||'';
    state.hidden=true;content.hidden=false;
  }).catch(function(e){fail(e&&e.message==='nf'?'This article could not be found.':'This article could not be loaded right now.')})
})();
</script>
</body>
</html>
